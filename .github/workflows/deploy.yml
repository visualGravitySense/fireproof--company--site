name: Deploy to GitHub Pages

on:
  # Запуск при push в ветку main
  push:
    branches:
      - main
      - master
  
  # Ручной запуск через GitHub Actions UI
  workflow_dispatch:

# Разрешить только один одновременный деплой
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Telegram secrets
        run: |
          if [ -z "${{ secrets.VITE_TELEGRAM_ADMIN_CHAT_ID }}" ]; then
            echo "::error::VITE_TELEGRAM_ADMIN_CHAT_ID не задан! Добавьте в Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "VITE_TELEGRAM_ADMIN_CHAT_ID: OK"
          API_URL="${{ secrets.VITE_TELEGRAM_API_URL }}"
          if [ -z "$API_URL" ]; then
            echo "VITE_TELEGRAM_API_URL: используется fallback (fireproof-site.vercel.app)"
          else
            echo "VITE_TELEGRAM_API_URL: задан"
          fi

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: true
          # Автоматически определяем название репозитория для base path
          REPO_NAME: ${{ github.event.repository.name }}
          # Если используется кастомный домен (fireproof.ee), установите USE_CUSTOM_DOMAIN=true
          USE_CUSTOM_DOMAIN: true
          # Telegram бот: API на Vercel (обязательно для GitHub Pages)
          VITE_TELEGRAM_API_URL: ${{ secrets.VITE_TELEGRAM_API_URL || 'https://fireproof-company-site.vercel.app/api/bot1' }}
          # Chat ID — ОБЯЗАТЕЛЬНО добавить в Settings → Secrets: VITE_TELEGRAM_ADMIN_CHAT_ID
          VITE_TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.VITE_TELEGRAM_ADMIN_CHAT_ID }}
          # EmailJS (опционально)
          # VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          # VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          # VITE_EMAILJS_TEMPLATE_CONTACT: ${{ secrets.VITE_EMAILJS_TEMPLATE_CONTACT }}
          # VITE_EMAILJS_TEMPLATE_QUICK: ${{ secrets.VITE_EMAILJS_TEMPLATE_QUICK }}
          # VITE_EMAILJS_TEMPLATE_CONSULTATION: ${{ secrets.VITE_EMAILJS_TEMPLATE_CONSULTATION }}

      - name: Copy 404.html for SPA routing
        run: cp public/404.html dist/404.html || echo "404.html не найден в public, пропускаем"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
